<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kitchen Organiser</title>
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #2a231c;
      --muted: #5d5449;
      --green: #2f5d43;
      --green-soft: #e4efe8;
      --card: #fffdf8;
      --line: #d7cdbc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 20px 16px 56px;
    }
    main { max-width: 640px; margin: 0 auto; }
    .eyebrow {
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 { font-size: 1.85rem; line-height: 1.15; margin: 0 0 10px; }
    .lead { color: var(--muted); font-size: 1.08rem; margin: 0 0 20px; }
    .choice {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 15px;
      margin: 0 0 10px;
      font: inherit;
      color: inherit;
    }
    .choice strong { display: block; font-size: 1.12rem; margin-bottom: 4px; }
    .choice span { color: var(--muted); font-size: 0.98rem; }
    .choice:active { background: var(--green-soft); }
    .back {
      background: none;
      border: 0;
      color: var(--green);
      font: inherit;
      font-weight: 700;
      padding: 0 0 16px;
    }
    .block {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 0 0 12px;
    }
    .block h2 {
      font-size: 1.02rem;
      color: var(--green);
      margin: 0 0 8px;
    }
    .block p, .block li { margin: 0 0 8px; font-size: 1.05rem; }
    .block ol, .block ul { margin: 0; padding-left: 1.15rem; }
    .block li:last-child, .block p:last-child { margin-bottom: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <section id="home">
      <p class="eyebrow">Professional organiser</p>
      <h1>What is hardest in the kitchen right now?</h1>
      <p class="lead">Tap one. I will give you the first ten minutes, why it works, and what to buy later — not a shopping list first.</p>
      <button class="choice" data-id="bench"><strong>The bench is always buried</strong><span>Mugs, post, food and tools live on the worktop.</span></button>
      <button class="choice" data-id="pantry"><strong>There is no pantry</strong><span>Food is stacked in cupboards and gets lost.</span></button>
      <button class="choice" data-id="deep"><strong>Deep cupboards I cannot reach</strong><span>The back is a graveyard of tins and gadgets.</span></button>
      <button class="choice" data-id="small"><strong>The kitchen is too small</strong><span>No spare floor, no spare bench, everything fights.</span></button>
      <button class="choice" data-id="stuff"><strong>Too much stuff</strong><span>Duplicates, rarely used tools, no homes.</span></button>
    </section>

    <section id="plan" class="hidden"></section>
  </main>
  <script>
    var plans = {
      bench: {
        title: "Clear the bench first",
        minutes: ["Set a timer for ten minutes. Do not empty the whole kitchen.", "Take everything off the bench onto a tray or the table.", "Put back only the kettle and one tool you use every day.", "Give the rest a temporary home in one box labelled Later."],
        why: "A bench is a landing strip, not storage. If it stays clear, cooking feels possible again. Everything else can wait.",
        buy: "A shallow tray for incoming post and keys, and one utensil crock. Buy containers after the bench stays clear for three days."
      },
      pantry: {
        title: "Make a pantry without building one",
        minutes: ["Pick one cupboard that will be food only.", "Pull everything out. Bin expired packets without debating them.", "Group breakfast, cooking, and snacks into three piles.", "Put the three groups back as three zones, labels facing you."],
        why: "Food needs a home of its own. When breakfast lives together, you stop buying duplicates and stop losing bags at the back.",
        buy: "Later: a narrow pull-out rack, two or three baskets, and a lazy susan for the corner. Not today."
      },
      deep: {
        title: "Stop losing the back of the cupboard",
        minutes: ["Open the worst deep cupboard.", "Take out only the front row.", "Put everyday items back at the front.", "Park bulk and rarely used things to one side, not behind the daily stuff."],
        why: "Deep cupboards fail because the back becomes a graveyard. If you cannot see it, you will buy it again.",
        buy: "Later: a pull-out tray or turntable. That one fitting does more than a new set of containers."
      },
      small: {
        title: "Use height, not more furniture",
        minutes: ["Look up. Find one empty strip of wall or the space above the fridge.", "Move one daily item to eye level.", "Move one rarely used item up high or out of the kitchen.", "Leave the floor and bench alone for now."],
        why: "In a small kitchen the floor is already full. Vertical space is the only free room you have.",
        buy: "Later: one set of adjustable shelves or a slim wall rack. Do not add another trolley until the bench is clear."
      },
      stuff: {
        title: "Give things a job or let them leave",
        minutes: ["Choose one category only: mugs, containers, or gadgets.", "Keep the ones you used this week.", "Put the rest in a box marked Decide next week.", "Do not start a second category today."],
        why: "Too much stuff is usually too many homes that were never assigned. One category at a time beats a whole-room purge.",
        buy: "Later: nothing until the Decide box has been emptied once. Then buy only what gives a home to what you kept."
      }
    };

    function show(id) {
      var p = plans[id];
      var steps = p.minutes.map(function (s) { return "<li>" + s + "</li>"; }).join("");
      document.getElementById("home").classList.add("hidden");
      var plan = document.getElementById("plan");
      plan.classList.remove("hidden");
      plan.innerHTML =
        "<button class=\"back\" id=\"back\">← Choose another problem</button>" +
        "<p class=\"eyebrow\">Kitchen plan</p>" +
        "<h1>" + p.title + "</h1>" +
        "<div class=\"block\"><h2>First ten minutes</h2><ol>" + steps + "</ol></div>" +
        "<div class=\"block\"><h2>Why this works</h2><p>" + p.why + "</p></div>" +
        "<div class=\"block\"><h2>What to buy later</h2><p>" + p.buy + "</p></div>";
      document.getElementById("back").onclick = function () {
        plan.classList.add("hidden");
        document.getElementById("home").classList.remove("hidden");
        window.scrollTo(0, 0);
      };
      window.scrollTo(0, 0);
    }

    document.querySelectorAll(".choice").forEach(function (btn) {
      btn.onclick = function () { show(btn.getAttribute("data-id")); };
    });
  </script>
</body>
</html>
