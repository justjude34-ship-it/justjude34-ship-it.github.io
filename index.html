<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen Organiser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f1e8; color: #2c241b; line-height: 1.55; padding: 20px 16px 40px; }
    main { width: 100%; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.7rem; margin: 8px 0 10px; line-height: 1.2; overflow-wrap: anywhere; }
    .hint { color: #5b5146; font-size: 1.05rem; margin: 0 0 16px; overflow-wrap: break-word; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .chip { border: 1px solid #c9bba8; background: #fff; color: #3a3229; border-radius: 999px; padding: 8px 12px; font-size: 0.95rem; cursor: pointer; }
    textarea { width: 100%; min-height: 140px; padding: 12px; font-size: 1.05rem; line-height: 1.4; border: 1px solid #c9bba8; border-radius: 12px; background: #fff; color: #2c241b; resize: vertical; }
    button.primary { display: block; width: 100%; margin-top: 12px; padding: 14px 16px; font-size: 1.1rem; font-weight: 600; border: 0; border-radius: 12px; background: #3d6b4f; color: #fff; cursor: pointer; }
    button.primary:active { background: #2f5440; }
    #advice { margin-top: 18px; }
    .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; overflow-wrap: break-word; }
    .card strong { display: block; margin-bottom: 4px; color: #3d6b4f; }
  </style>
</head>
<body>
  <main>
    <h1>Kitchen Organiser</h1>
    <p class="hint">Type what is hard about your kitchen. Then tap Get advice.</p>
    <div class="chips">
      <button type="button" class="chip" data-text="small kitchen, no pantry">small, no pantry</button>
      <button type="button" class="chip" data-text="cluttered bench">cluttered bench</button>
      <button type="button" class="chip" data-text="deep cabinets I cannot reach the back of">deep cabinets</button>
      <button type="button" class="chip" data-text="too much stuff, no zones">too much stuff</button>
    </div>
    <textarea id="problem" placeholder="Example: small kitchen, no pantry, cluttered bench"></textarea>
    <button type="button" class="primary" onclick="getAdvice()">Get advice</button>
    <div id="advice"></div>
  </main>
  <script>
    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var box = document.getElementById("problem");
        var extra = chip.getAttribute("data-text");
        box.value = box.value ? box.value + ", " + extra : extra;
        box.focus();
      });
    });
    function getAdvice() {
      var text = document.getElementById("problem").value.toLowerCase();
      var out = [];
      if (text.includes("small") || text.includes("tiny") || text.includes("no space")) {
        out.push(["Small space", "Use vertical space first. Add adjustable shelves so every centimetre of height works."]);
      }
      if (text.includes("pantry") || text.includes("no pantry")) {
        out.push(["No pantry", "Use a pull-out pantry, baskets, and a lazy susan in the corner so food is not lost at the back."]);
      }
      if (text.includes("clutter") || text.includes("cluttered") || text.includes("bench") || text.includes("counter") || text.includes("stuff")) {
        out.push(["Cluttered surfaces", "Clear the bench first. Keep only daily tools out. Use one-in-one-out so clutter does not creep back."]);
      }
      if (text.includes("cabinet") || text.includes("storage") || text.includes("deep") || text.includes("reach")) {
        out.push(["Cabinets", "Choose deep, wide cabinets with adjustable shelves. Put everyday items at the front, not the back."]);
      }
      if (text.includes("zone") || text.includes("workflow") || text.includes("work")) {
        out.push(["Zones", "Give the kitchen four jobs: work, storage, landing, and maintenance. Keep like with like."]);
      }
      if (out.length === 0) {
        out.push(["Need a bit more", "Say if it is small, missing a pantry, cluttered, or hard to reach. I will match that to the rules and products."]);
      }
      var html = "";
      for (var i = 0; i < out.length; i++) {
        html += "<div class=\"card\"><strong>" + out[i][0] + "</strong>" + out[i][1] + "</div>";
      }
      document.getElementById("advice").innerHTML = html;
    }
  </script>
</body>
</html>
