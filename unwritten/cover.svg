<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset=".42" stop-color="#f3e6d0"/>
      <stop offset="1" stop-color="#e2c9a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="82%" cy="8%" r="46%">
      <stop offset="0" stop-color="#fffdf6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#f6d9a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8d4b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ae86"/>
      <stop offset=".5" stop-color="#b49264"/>
      <stop offset="1" stop-color="#9a7548"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#f2e6d2"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#eddcc3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c27a"/>
      <stop offset=".5" stop-color="#c4a574"/>
      <stop offset="1" stop-color="#a8844c"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6a4e28" flood-opacity=".28"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1080" height="720" fill="url(#sky)"/>
